name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  forge:
    name: forge build + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge --version
        run: forge --version

      - name: forge fmt --check
        run: forge fmt --check

      - name: forge build
        run: forge build --sizes

  release:
    name: GitHub Release
    needs: forge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

      # NOTE: `npm publish` is INTENTIONALLY OMITTED.
      # @luxfi/p3q-evm is audit-gated (P3QVerifierStub rejects every
      # proof until the Rust p3q-verifier audit clears). Enable
      # publishing only after audit sign-off by adding an
      # `npm publish --access public` step here (and configuring
      # NODE_AUTH_TOKEN / actions/setup-node@v4 with registry-url).
